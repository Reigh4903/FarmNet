<div class="container auth-container">
    <link rel="stylesheet" href="../styles.css">
    <div class="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">Login</h2>
            <p id="auth-subtitle">Access your FarmNet account</p>
        </div>

        <form id="auth-form">
            <div id="signup-fields" style="display: none;">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="farmer-type" class="form-label">I am a</label>
                    <select id="farmer-type" class="form-control">
                        <option value="">Select farmer type</option>
                        <option value="cattle">Cattle Farmer</option>
                        <option value="goat">Goat Farmer</option>
                        <option value="sheep">Sheep Farmer</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
            </div>

            <div id="login-actions" class="form-group">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#forgot-password" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Login</button>
        </form>

        <div class="auth-footer">
            <p id="auth-switch-text">Don't have an account? <a href="#" id="auth-switch-link">Sign up</a></p>
        </div>
    </div>
    </div>
