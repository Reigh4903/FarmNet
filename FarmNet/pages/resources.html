<div class="container">
    <link rel="stylesheet" href="../styles.css">
    <section class="resources-header">
        <h1>Farming Resources</h1>
        <p class="lead">Educational materials, tools, and guides to help you succeed in livestock farming.</p>
        <div class="search-box">
            <input type="text" placeholder="Search resources...">
            <button class="btn btn-primary"><i class="fas fa-search"></i></button>
        </div>
    </section>

    <section class="resource-categories">
        <h2 class="section-title">Browse by Category</h2>
        <div class="grid grid-4">
            <a href="#cattle" class="category-card cattle">
                <i class="fas fa-cow"></i>
                <h3>Cattle</h3>
            </a>
            <a href="#goat" class="category-card goat">
                <i class="fas fa-"></i>
                <h3>Goats</h3>
            </a>
            <a href="#sheep" class="category-card sheep">
                <i class="fas fa-sheep"></i>
                <h3>Sheep</h3>
            </a>
            <a href="#economics" class="category-card economics">
                <i class="fas fa-rupee-sign"></i>
                <h3>Economics</h3>
            </a>
        </div>
    </section>

    <section class="featured-resources">
        <h2 class="section-title">Featured Resources</h2>
        <div class="grid grid-3" id="resources-container">
            <!-- Resources will be loaded here via JavaScript -->
        </div>
    </section>
    </div>
